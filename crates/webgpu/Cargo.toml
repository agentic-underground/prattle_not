[package]
name = "prattle-webgpu"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# Our own GPU engine for the page's WebGPU twin: wgpu (Vulkan, Metal or DX12 natively; WebGPU in a
# browser) running hand-written WGSL kernels. candle has no WebGPU backend.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = "27"
bytemuck = "1"
serde_json = "1"
safetensors = "0.6"
half = "2"
prattle-core = { path = "../core" }
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm"] }
futures-channel = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dev-dependencies]
pollster = "0.4"
candle-core = "0.11"
candle-nn = "0.11"
