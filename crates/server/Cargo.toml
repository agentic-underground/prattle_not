[package]
name = "server"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "prattle-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "io-util", "sync"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
serde_json = "1"
prattle-core = { path = "../core", features = ["hub"] }
candle-core = "0.11"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = "0.23"

[features]
# /compare runs its models on the GPUs PRATTLE_DEVICES names (candle's CUDA backend).
cuda = ["prattle-core/cuda"]

[dev-dependencies]
rcgen = "0.13"
